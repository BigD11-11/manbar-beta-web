<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/manbar-beta-web/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Manbar | منبر — المجالس، المزارات، وشعائر أهل البيت حول العالم.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#571522">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="منبر">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/manbar-mark.svg">
  <link rel="apple-touch-icon" href="icons/Icon-1024.png">
  <title>Manbar | منبر</title>
  <style>
    :root{--maroon:#571522;--maroon2:#7A1F32;--ivory:#FFF9F1;--sand:#F4EBDD;--teal:#176B68;--gold:#B99146;--ink:#211B1C}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
    #manbar-boot{position:fixed;inset:0;display:grid;place-items:center;background:
      radial-gradient(circle at 50% 16%,rgba(185,145,70,.12),transparent 28%),
      linear-gradient(160deg,#fffdf9 0%,var(--ivory) 54%,#f8eee2 100%);z-index:99999;transition:opacity .42s ease,visibility .42s ease}
    #manbar-boot.hide{opacity:0;visibility:hidden;pointer-events:none}
    .boot-card{width:min(88vw,390px);text-align:center;padding:34px 26px 28px;border:1px solid rgba(87,21,34,.08);border-radius:34px;background:rgba(255,255,255,.68);box-shadow:0 24px 70px rgba(52,31,30,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .mark{width:88px;height:88px;margin:auto;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,var(--maroon2),var(--maroon));box-shadow:0 18px 36px rgba(87,21,34,.24);color:white;font-size:42px;font-weight:800;letter-spacing:-2px}
    .brand{margin-top:20px;font-size:32px;font-weight:800;letter-spacing:-.8px;color:var(--ink)}
    .brand span{color:var(--maroon)}
    .tag{margin:8px auto 0;max-width:280px;font-size:15px;line-height:1.7;color:#6e6263}
    .pulse{margin:25px auto 0;width:44px;height:5px;border-radius:999px;background:#eadfd4;overflow:hidden}
    .pulse::after{content:"";display:block;width:55%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),var(--gold));animation:move 1.05s ease-in-out infinite alternate}
    @keyframes move{from{transform:translateX(-5%)}to{transform:translateX(85%)}}
    @media (prefers-reduced-motion:reduce){.pulse::after{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="manbar-boot" aria-label="Manbar is loading">
    <div class="boot-card">
      <div class="mark">م</div>
      <div class="brand">Manbar <span>| منبر</span></div>
      <div class="tag">المجالس، المزارات، وشعائر أهل البيت حول العالم.</div>
      <div class="pulse"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame',()=>document.getElementById('manbar-boot')?.classList.add('hide'));
    setTimeout(()=>document.getElementById('manbar-boot')?.classList.add('hide'),9000);
  </script>
</body>
</html>
